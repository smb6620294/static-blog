<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Assignments - AdSense</title>
  <link rel="stylesheet" href="/assets/css/admin.css">
  <style>
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #dcdcde; flex-wrap: wrap; }
    .nav-tab { padding: 10px 18px; font-size: 13px; color: #50575e; text-decoration: none; border: 1px solid transparent; border-bottom: none; border-radius: 4px 4px 0 0; cursor: pointer; background: transparent; font-family: inherit; }
    .nav-tab:hover { background: #f6f7f7; color: #2271b1; }
    .nav-tab.active { background: #fff; border-color: #dcdcde; border-bottom-color: #fff; color: #2271b1; font-weight: 600; margin-bottom: -1px; }
    
    .info-box { background: #f0f6fc; border-left: 4px solid #2271b1; padding: 14px 18px; border-radius: 4px; margin-bottom: 20px; font-size: 13px; line-height: 1.7; }
    
    .page-row { background: #fff; border: 1px solid #dcdcde; border-radius: 6px; padding: 18px; margin-bottom: 12px; }
    .page-header-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .page-name { font-size: 15px; font-weight: 600; color: #1d2327; display: flex; align-items: center; gap: 8px; }
    .page-path { font-family: 'Consolas', monospace; font-size: 12px; color: #646970; margin-top: 3px; }
    
    .toggle-switch { position: relative; width: 46px; height: 24px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; transition: 0.3s; border-radius: 24px; }
    .toggle-slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; transition: 0.3s; border-radius: 50%; }
    input:checked + .toggle-slider { background: #00a32a; }
    input:checked + .toggle-slider:before { transform: translateX(22px); }
    
    .page-units { margin-top: 15px; padding-top: 15px; border-top: 1px solid #f0f0f1; }
    .page-units-title { font-size: 12px; color: #646970; text-transform: uppercase; font-weight: 600; margin-bottom: 10px; }
    .unit-tag { display: inline-flex; align-items: center; gap: 4px; background: #f0f6fc; color: #2271b1; padding: 4px 10px; border-radius: 3px; font-size: 12px; margin: 3px; }
    .unit-tag .x { cursor: pointer; font-weight: bold; color: #d63638; }
    .unit-tag .x:hover { color: #a02225; }
    
    .status-message { padding: 12px 16px; border-radius: 4px; margin-top: 16px; font-size: 13px; display: none; }
    .status-message.success { background: #edfaef; color: #00a32a; border-left: 4px solid #00a32a; display: block; }
    .status-message.error { background: #fcf0f1; color: #d63638; border-left: 4px solid #d63638; display: block; }
  </style>
</head>
<body>

  <div id="admin-wrapper">
    <div id="sidebar-container"></div>
    
    <main id="admin-content">
      
      <div class="admin-page-header">
        <h1 class="admin-page-title">📄 Page Assignments</h1>
        <a href="../index.html" class="wp-btn wp-btn-secondary">← Dashboard</a>
      </div>
      
      <div class="nav-tabs">
        <a href="index.html" class="nav-tab">📊 Dashboard</a>
        <a href="settings.html" class="nav-tab">⚙️ Settings</a>
        <a href="units.html" class="nav-tab">📦 Ad Units</a>
        <a href="pages.html" class="nav-tab active">📄 Pages</a>
      </div>
      
      <div class="info-box">
        ℹ️ <b>Page Assignments:</b> جس پیج پر AdSense چاہیں، اسے Enabled کریں۔<br>
        <b>404.html</b> ہمیشہ Disabled رہے گا (AdSense وہاں نہیں دکھانا)۔
      </div>
      
      <div id="pagesList">
        <div style="text-align:center;padding:40px;color:#666;">⏳ Loading...</div>
      </div>
      
      <div class="status-message" id="statusMessage"></div>
      
    </main>
  </div>

  <script src="/assets/js/transliterate.js"></script>
  <script src="/assets/js/load-sidebar.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/token.js"></script>
  <script src="/assets/js/github-api.js"></script>
  
  <script>
    const PAGES_FILE = 'admin/adsense/config/pages.json';
    const UNITS_FILE = 'admin/adsense/config/units.json';
    
    let pagesData = { pages: {} };
    let unitsData = { units: [] };
    
    const ALL_PAGES = [
      { path: 'index.html', name: '🏠 Homepage' },
      { path: 'single-post.html', name: '📝 Single Post' },
      { path: 'category.html', name: '📂 Category Page' },
      { path: 'tag.html', name: '🏷️ Tag Page' },
      { path: 'search.html', name: '🔍 Search Results' },
      { path: 'about.html', name: 'ℹ️ About Page' },
      { path: 'contact.html', name: '📧 Contact Page' },
      { path: '404.html', name: '❌ 404 Page (غیر فعال)' }
    ];
    
    // ==================== LOAD ====================
    async function loadData() {
      let token = getToken();
      if (!token) { promptForToken(); return; }
      
      try {
        let pagesFetched = await fetchFileFromGitHub(PAGES_FILE);
        if (pagesFetched && pagesFetched.pages) pagesData = pagesFetched;
        
        let unitsFetched = await fetchFileFromGitHub(UNITS_FILE);
        if (unitsFetched && unitsFetched.units) unitsData = unitsFetched;
        
        renderPages();
      } catch (err) {
        console.error(err);
        document.getElementById('pagesList').innerHTML = '<div style="text-align:center;padding:40px;color:#d63638;">❌ Error</div>';
      }
    }
    
    // ==================== RENDER ====================
    function renderPages() {
      let list = document.getElementById('pagesList');
      let html = '';
      
      ALL_PAGES.forEach(page => {
        let pageConfig = pagesData.pages[page.path] || { enabled: false, units: [] };
        let is404 = page.path === '404.html';
        let isEnabled = is404 ? false : (pageConfig.enabled || false);
        
        html += `
          <div class="page-row">
            <div class="page-header-row">
              <div>
                <div class="page-name">${page.name}</div>
                <div class="page-path">${page.path}</div>
              </div>
              <label class="toggle-switch">
                <input type="checkbox" ${isEnabled ? 'checked' : ''} ${is404 ? 'disabled' : ''} onchange="togglePage('${page.path}', this.checked)">
                <span class="toggle-slider"></span>
              </label>
            </div>
            ${!is404 ? `
              <div class="page-units">
                <div class="page-units-title">Active Units (${pageConfig.units.length})</div>
                ${pageConfig.units.map(slug => {
                  let unit = unitsData.units.find(u => u.slug === slug);
                  return unit ? `<span class="unit-tag">📦 ${escapeHtml(unit.name)} <span class="x" onclick="removeUnitFromPage('${page.path}', '${slug}')">×</span></span>` : '';
                }).join('') || '<div style="color:#999;font-size:12px;">No units assigned</div>'}
              </div>
            ` : ''}
          </div>
        `;
      });
      
      list.innerHTML = html;
    }
    
    // ==================== TOGGLE PAGE ====================
    async function togglePage(pagePath, enabled) {
      if (!pagesData.pages[pagePath]) {
        pagesData.pages[pagePath] = { enabled: enabled, units: [] };
      } else {
        pagesData.pages[pagePath].enabled = enabled;
      }
      
      await savePages();
      showStatus(`✅ ${pagePath} ${enabled ? 'enabled' : 'disabled'}`, 'success');
    }
    
    // ==================== REMOVE UNIT ====================
    async function removeUnitFromPage(pagePath, unitSlug) {
      if (!pagesData.pages[pagePath]) return;
      pagesData.pages[pagePath].units = pagesData.pages[pagePath].units.filter(u => u !== unitSlug);
      await savePages();
      renderPages();
      showStatus(`🗑️ Unit removed from ${pagePath}`, 'success');
    }
    
    // ==================== SAVE ====================
    async function savePages() {
      let token = getToken();
      if (!token) return;
      
      try {
        let jsonContent = JSON.stringify(pagesData, null, 2);
        let contentBase64 = encodeBase64(jsonContent);
        await uploadFileToGitHub(PAGES_FILE, contentBase64, `Update page assignments`);
      } catch (err) {
        showStatus('❌ ' + err.message, 'error');
      }
    }
    
    // ==================== STATUS ====================
    function showStatus(message, type) {
      let el = document.getElementById('statusMessage');
      el.textContent = message;
      el.className = 'status-message ' + type;
      setTimeout(() => el.className = 'status-message', 4000);
    }
    
    // ==================== INIT ====================
    window.addEventListener('load', async function() {
      checkToken();
      await loadData();
    });
  </script>
</body>
</html>
