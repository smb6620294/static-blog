<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test 2 - utils.js</title>
  <style>
    body { font-family: monospace; background: #000; color: #0f0; padding: 20px; font-size: 16px; }
    .ok { color: #0f0; }
    .fail { color: #f55; }
    .info { color: #0ff; }
  </style>
</head>
<body>
  <h1 style="color:#0ff;">TEST 2 - utils.js</h1>
  <div id="out">Loading...</div>

  <script src="/assets/js/transliterate.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    var out = document.getElementById('out');
    var html = '';
    
    html += '<div class="info">Scripts loaded. Checking functions...</div>';
    
    var checks = [
      ['escapeHtml', 'function'],
      ['generateSlug', 'function'],
      ['formatDate', 'function'],
      ['formatTime', 'function'],
      ['getTimezone', 'function'],
      ['encodeBase64', 'function'],
      ['decodeBase64', 'function'],
      ['smartSlugify', 'function'],
      ['transliterate', 'function']
    ];
    
    checks.forEach(function(c) {
      var name = c[0];
      var expectedType = c[1];
      if (typeof window[name] === expectedType) {
        html += '<div class="ok">OK: ' + name + ' exists</div>';
      } else {
        html += '<div class="fail">MISSING: ' + name + '</div>';
      }
    });
    
    try {
      var test = escapeHtml('<test>');
      html += '<div class="ok">escapeHtml works: ' + test + '</div>';
    } catch (e) {
      html += '<div class="fail">escapeHtml CRASH: ' + e.message + '</div>';
    }
    
    out.innerHTML = html;
  </script>
</body>
</html>
