<!-- ============================================
     FRONTEND PAGINATION COMPONENT
     Path: /assets/frontend/components/pagination.html
     Loaded by: /assets/frontend/js/f-load-pagination.js
     
     Structure:
       [« First] [‹ Prev] 1 2 [3] 4 5 ... 10 [› Next] [» Last]
     ============================================ -->
<nav class="pagination-wrapper" id="paginationWrapper" aria-label="Posts navigation">
  <!-- First Page Button -->
  <button type="button" 
          class="pagination-btn pag-first" 
          id="pagFirst" 
          onclick="goToPage(1)"
          aria-label="First page">
    <span class="pag-icon">«</span>
  </button>

  <!-- Previous Page Button -->
  <button type="button" 
          class="pagination-btn pag-prev" 
          id="pagPrev" 
          onclick="goToPrevPage()"
          aria-label="Previous page">
    <span class="pag-icon">‹</span>
  </button>

  <!-- Numbered Pages (filled by JS) -->
  <div class="pagination-numbers" id="paginationNumbers"></div>

  <!-- Next Page Button -->
  <button type="button" 
          class="pagination-btn pag-next" 
          id="pagNext" 
          onclick="goToNextPage()"
          aria-label="Next page">
    <span class="pag-icon">›</span>
  </button>

  <!-- Last Page Button -->
  <button type="button" 
          class="pagination-btn pag-last" 
          id="pagLast" 
          onclick="goToPage(totalPages)"
          aria-label="Last page">
    <span class="pag-icon">»</span>
  </button>
</nav>

<!-- Page Info Text -->
<div class="pagination-info" id="paginationInfo"></div>
